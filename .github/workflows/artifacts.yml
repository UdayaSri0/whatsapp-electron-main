name: Candidate Linux artifacts (no publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:linux
      - run: npm run release:assets
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-candidate-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*-source.tar.gz
            dist/BUILD-COMMIT.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
