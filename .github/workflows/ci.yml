name: Linux validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:dir
      - run: npm run build:deb
      - run: npm run build
      - name: Inspect Debian package contents
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - run: npm run release:assets
      - name: Verify candidate checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-candidate-validation
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*-source.tar.gz
            dist/BUILD-COMMIT.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
